<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вісник знань: діячі другої половини XIX ст.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#efe3c8;--paper2:#e6d6b3;--ink:#2b2118;--faded:#6b5a45;--red:#8b1e1e;--green:#2f5d3a;--rule:#2b2118;--page:#c9b48d;
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#2a231b;--paper2:#352c22;--ink:#eadcbf;--faded:#b9a789;--red:#e0765f;--green:#8fc79a;--rule:#cdb990;--page:#17120d;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#2a231b;--paper2:#352c22;--ink:#eadcbf;--faded:#b9a789;--red:#e0765f;--green:#8fc79a;--rule:#cdb990;--page:#17120d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Old Standard TT",Georgia,"Times New Roman",serif;font-size:18px;line-height:1.55}
.sheet{max-width:760px;margin:18px auto 40px;background:var(--paper);padding:26px clamp(16px,4vw,44px) 34px;position:relative;
 box-shadow:0 0 0 1px var(--rule),0 0 0 6px var(--paper),0 0 0 7px var(--rule),0 18px 40px rgba(0,0,0,.35);
 background-image:radial-gradient(ellipse at 20% 10%,rgba(120,90,40,.08),transparent 60%),radial-gradient(ellipse at 90% 90%,rgba(120,90,40,.12),transparent 55%)}
.mast{text-align:center;border-bottom:3px double var(--rule);padding-bottom:8px}
.mast .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--faded);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:3px 0;margin-top:6px;font-style:italic}
.mast h1{font-family:"Playfair Display SC",Georgia,serif;font-weight:900;font-size:clamp(34px,8vw,64px);line-height:1;margin:6px 0 2px;letter-spacing:1px}
.mast .tag{font-style:italic;margin:0;color:var(--faded)}
.orn{text-align:center;color:var(--faded);letter-spacing:6px;margin:10px 0;font-size:16px}
.no{font-family:"Playfair Display SC",Georgia,serif;font-weight:700;text-align:center;margin:14px 0 4px;font-size:15px;letter-spacing:2px;color:var(--red)}
.q{font-size:22px;text-align:center;margin:0 0 14px;line-height:1.35}
.q i{display:block;font-size:17px;color:var(--faded);margin-top:4px}
.cameo{display:block;margin:6px auto 16px;width:190px;height:240px;object-fit:cover;border-radius:50%;filter:sepia(.55) contrast(1.05);border:3px double var(--rule);box-shadow:0 0 0 6px var(--paper),0 0 0 7px var(--rule)}
.opts{list-style:none;padding:0;margin:0 auto;max-width:520px}
.opts button{all:unset;cursor:pointer;display:flex;gap:10px;width:100%;box-sizing:border-box;padding:8px 6px;border-bottom:1px dotted var(--faded);font-size:19px}
.opts button b{font-family:"Playfair Display SC",Georgia,serif;color:var(--red);width:22px;flex:none}
.opts button:hover{background:var(--paper2)}
.opts button:focus-visible,.btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.opts button.right{background:var(--paper2);font-weight:700;color:var(--green)}
.opts button.wrong{text-decoration:line-through;text-decoration-color:var(--red);color:var(--faded)}
.opts button[disabled]{pointer-events:none}
.note{position:relative;margin:22px auto 0;max-width:560px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 4px 12px}
.note h3{margin:0 0 4px;font-family:"Playfair Display SC",Georgia,serif;font-size:17px;letter-spacing:1px}
.note p{margin:4px 0}
.note .mn{font-style:italic;color:var(--faded)}
.stamp{position:absolute;right:-6px;top:-34px;transform:rotate(-12deg);font-family:"Playfair Display SC",Georgia,serif;font-weight:900;font-size:18px;letter-spacing:2px;
 padding:6px 14px;border:3px solid currentColor;border-radius:50%/40%;opacity:.85;animation:press .35s ease-out;background:transparent}
.stamp.ok{color:var(--green)}.stamp.bad{color:var(--red)}
@keyframes press{from{transform:rotate(-12deg) scale(1.8);opacity:0}}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
.tally{font-style:italic;color:var(--faded)}
.btn{all:unset;cursor:pointer;font-family:"Playfair Display SC",Georgia,serif;font-weight:700;letter-spacing:1px;padding:8px 18px;border:2px solid var(--rule);background:var(--paper2)}
.btn:hover{background:var(--ink);color:var(--paper)}
.cert{text-align:center;border:3px double var(--rule);padding:20px;margin-top:16px;outline:1px solid var(--rule);outline-offset:6px}
.cert .score{font-family:"Playfair Display SC",Georgia,serif;font-weight:900;font-size:64px;margin:0;color:var(--red);line-height:1}
.cert h2{font-family:"Playfair Display SC",Georgia,serif;margin:4px 0 8px}
.prog{display:flex;gap:4px;justify-content:center;margin-top:10px}
.prog span{width:10px;height:10px;border:1px solid var(--rule);transform:rotate(45deg)}
.prog span.ok{background:var(--green)}.prog span.bad{background:var(--red)}.prog span.cur{background:var(--ink)}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
</style>
</head>

  t:"Михайло Драгоманов",e:"Історик, публіцист, філософ. У Женеві видавав перший український політичний журнал «Громада». Виступав за федеративний устрій — автономію України у складі перебудованої держави.",m:"Драгоманов — «Д» як «далеко»: думки в Женеві, а ідеї вдома."},

  t:"Микола Міхновський",e:"Харківський адвокат, один із «тарасівців» — першої самостійницької організації Наддніпрянщини (1891). У брошурі «Самостійна Україна» (1900) обґрунтував право на незалежну державу.",m:"Міхновський — «Мій Хрест — Незалежність»."},

const app=document.getElementById("app");
let i=0,score=0,res=[];
function prog(){return `<div class="prog" aria-hidden="true">${QS.map((_,k)=>`<span class="${res[k]===true?"ok":res[k]===false?"bad":k===i?"cur":""}"></span>`).join("")}</div>`}
function draw(){const q=QS[i];
 app.innerHTML=`<div class="orn">❦ ❦ ❦</div><p class="no">Оповістка № ${i+1} з ${QS.length}</p>
 ${q.img?`<img class="cameo" src="${q.img}" alt="Світлина історичного діяча">`:""}
 <p class="q">${q.q}${q.i?`<i>${q.i}</i>`:""}</p>
 <ul class="opts">${q.o.map((t,k)=>`<li><button data-k="${k}"><b>${L[k]}</b><span>${t}</span></button></li>`).join("")}</ul>
 <div id="fb"></div>${prog()}`;
 app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>answer(+b.dataset.k));window.scrollTo(0,0)}
function answer(k){const q=QS[i],ok=k===q.a;if(ok)score++;res[i]=ok;
 app.querySelectorAll(".opts button").forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
 document.getElementById("fb").innerHTML=`<div class="note"><span class="stamp ${ok?"ok":"bad"}">${ok?"Вірно":"Хибно"}</span>
 <h3>Примітка редакції: ${q.t}</h3><p>${q.e}</p><p class="mn">☞ ${q.m}</p></div>
 <div class="foot"><span class="tally">Вірних відповідей: ${score} з ${i+1}</span><button class="btn" id="nx">${i<QS.length-1?"Наступна оповістка":"Отримати атестат"}</button></div>`;
 app.querySelector(".prog").outerHTML=prog();
 const nx=document.getElementById("nx");nx.focus();nx.onclick=()=>{i++;i<QS.length?draw():fin()}}
function fin(){const r=score>=9?["Як Франко-каменяр","Розбиваєте будь-яке завдання!"]:score>=7?["Як Грушевський","Усе розкладено по полицях."]:score>=5?["Як Драгоманов","Думки ще в Женеві — варто повторити."]:["Як Гаспринський","Потрібен «Терджиман» — повторімо тему разом."];
 app.innerHTML=`<div class="orn">❦ ❦ ❦</div><div class="cert"><p class="no">Атестат</p><p class="score">${score}/${QS.length}</p><h2>${r[0]}</h2><p>${r[1]}</p>${prog()}
 <div class="foot" style="justify-content:center"><button class="btn" id="again">Пройти ще раз</button></div></div>`;
 document.getElementById("again").onclick=()=>{i=0;score=0;res=[];draw()}}
draw();
</script>
